<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In / Sign Up</title>
    <link rel="stylesheet" href="login_signup2.css" />
  </head>
  <body>
    <div class="auth-card">
      <div class="topbar">
        <h1 class="title">Welcome</h1>
        <div class="switcher" aria-label="Authentication options">
          <button class="switch-btn active" type="button" data-target="signin">Sign in</button>
          <button class="switch-btn" type="button" data-target="signup">Sign up</button>
        </div>
      </div>

      <!-- SIGN IN SECTION -->
      <section id="signin" class="form-section active">
        <p class="subtitle">Click below to securely sign in via Auth0.</p>
        <button id="btn-login" class="submit-btn" type="button">Sign in with Auth0</button>
      </section>

      <!-- SIGN UP SECTION -->
      <section id="signup" class="form-section">
        <p class="subtitle">Create a new account securely via Auth0.</p>
        <button id="btn-signup" class="submit-btn" type="button">Create account with Auth0</button>
      </section>

      <div id="status" class="status" aria-live="polite"></div>
    </div>

    <!-- 1. Install Auth0 SDK -->
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>

    <script>
      // ==========================================
      // UI / TAB SWITCHING LOGIC
      // ==========================================
      const tabs = document.querySelectorAll('.switch-btn');
      const sections = {
        signin: document.getElementById('signin'),
        signup: document.getElementById('signup')
      };

      function switchSection(target) {
        tabs.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.target === target);
        });
        Object.entries(sections).forEach(([key, section]) => {
          section.classList.toggle('active', key === target);
        });
      }

      tabs.forEach((btn) => {
        btn.addEventListener('click', () => switchSection(btn.dataset.target));
      });

      // ==========================================
      // AUTH0 LOGIC
      // ==========================================
      let client;
      
      (async () => {
        try {
          // Initialize Auth0 connection
          client = await auth0.createAuth0Client({
            domain: 'dev-na3t3nvz7h4erpep.us.auth0.com',
            clientId: 'jF1hl8MaOoakXzqwkDbhmQje6NBLL7I6',
            authorizationParams: { 
              // Send the user back to your main website root (e.g., your map page) after they log in!
              redirect_uri: window.location.origin
            },
          });
        } catch (e) {
          console.error("Auth0 failed to initialize:", e);
        }
      })();

      // Wire up the Sign In button
      document.getElementById('btn-login').addEventListener('click', async () => {
        if (client) {
            await client.loginWithRedirect();
        }
      });

      // Wire up the Sign Up button
      document.getElementById('btn-signup').addEventListener('click', async () => {
        if (client) {
            // The screen_hint tells Auth0 to open directly to the sign-up tab
            await client.loginWithRedirect({
                authorizationParams: { screen_hint: 'signup' }
            });
        }
      });
    </script>
  </body>
</html>
