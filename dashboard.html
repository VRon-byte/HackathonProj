<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TouchGrass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header-row">
      <div class="brand">
        <h1>TouchGrass</h1>
        <p>Explore what's happening near you</p>
      </div>
    </div>

    <div class="auth-buttons">
      <button class="login-button">Login</button>
      <button class="signup-button">Sign Up</button>
    </div>

    <nav class="event-views" aria-label="Event views">
      <button class="event-view active" id="allEventsView" type="button" data-view="all" aria-pressed="true">🗺️ All Events</button>
      <button class="event-view" type="button" data-view="pinned" aria-pressed="false">📌 Pinned Events</button>
    </nav>

    <section class="filter-sections">
      <h2>Filters</h2>
      <div class="filter-buttons">
        <button class="filter-active" type="button" data-category="All">All</button>
        <button class="filter-button" type="button" data-category="Music">Music</button>
        <button class="filter-button" type="button" data-category="Markets">Markets</button>
        <button class="filter-button" type="button" data-category="Museums">Museums</button>
        <button class="filter-button" type="button" data-category="Sports">Sports</button>
        <button class="filter-button" type="button" data-category="Tech">Tech</button>
        <button class="filter-button" type="button" data-category="Arts">Arts</button>
        <button class="filter-button" type="button" data-category="Gardens">Gardens</button>
        <button class="filter-button" type="button" data-category="Food">Food</button>
        <button class="filter-button" type="button" data-category="Entertainment">Entertainment</button>
      </div>
    </section>

    <section class="events">
      <h2>Nearby Events</h2>
      <p class="no-pinned-events" id="noPinnedEvents" hidden>No pinned events yet.</p>
      <p class="no-events-found" id="noEventsFound" hidden>No events found.</p>
      <div id="eventList"></div>
    </section>

  </aside>

  <main class="map-area">
    <div class="map-placeholder">
      <div class="zoom-controls">
        <button>+</button>
        <button>−</button>
      </div>
      <div class="marker music">🎵</div>
      <div class="marker market">🛍️</div>
      <div class="marker tech">💻</div>
      <div class="marker sports">⚽</div>
      <div class="marker art">🎨</div>
    </div>
  </main>

  <dialog class="auth-dialog" id="authDialog">
    <form class="auth-form" id="authForm">
      <button class="auth-dialog-close" id="authDialogClose" type="button">✕</button>
      <h2 id="authTitle">Log in to TouchGrass</h2>
      <p class="auth-dialog-copy" id="authCopy">Find and save events around you.</p>
      <label id="nameField" hidden>Display name<input id="authName" type="text" autocomplete="name"></label>
      <label>Email<input id="authEmail" type="email" autocomplete="email" required></label>
      <label>Password<input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="auth-submit" type="submit" id="authSubmit">Log In</button>
      <p class="auth-message" id="authMessage" role="status"></p>
      <button class="auth-switch" type="button" id="authSwitch">Need an account? Sign up</button>
    </form>
  </dialog>

  <script>
    /* ── Sidebar ── */
    const sidebar = document.getElementById("sidebar");
    /* ── Auth dialog ── */
    const authDialog  = document.getElementById("authDialog");
    const authForm    = document.getElementById("authForm");
    const authTitle   = document.getElementById("authTitle");
    const authCopy    = document.getElementById("authCopy");
    const authSubmit  = document.getElementById("authSubmit");
    const authSwitch  = document.getElementById("authSwitch");
    const authMessage = document.getElementById("authMessage");
    const nameField   = document.getElementById("nameField");
    let authMode = "login";

    function openAuth(mode) {
      authMode = mode;
      const s = mode === "signup";
      authTitle.textContent   = s ? "Create your account" : "Log in to TouchGrass";
      authCopy.textContent    = s ? "Save events and find your people." : "Find and save events around you.";
      authSubmit.textContent  = s ? "Create Account" : "Log In";
      authSwitch.textContent  = s ? "Already have an account? Log in" : "Need an account? Sign up";
      nameField.hidden = !s;
      authMessage.textContent = "";
      authForm.reset();
      authDialog.showModal();
    }

    document.querySelector(".login-button").addEventListener("click",  () => openAuth("login"));
    document.querySelector(".signup-button").addEventListener("click", () => openAuth("signup"));
    document.getElementById("authDialogClose").addEventListener("click", () => authDialog.close());
    authSwitch.addEventListener("click", () => openAuth(authMode === "login" ? "signup" : "login"));
    authDialog.addEventListener("click", e => { if (e.target === authDialog) authDialog.close(); });

    authForm.addEventListener("submit", e => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const displayName = document.getElementById("authName").value.trim() || email.split("@")[0];
      localStorage.setItem("touchgrass-user", JSON.stringify({ email, displayName }));
      authMessage.textContent = authMode === "signup" ? "Account created!" : "Logged in!";
      document.querySelector(".login-button").textContent  = displayName;
      document.querySelector(".signup-button").textContent = "✓ In";
      setTimeout(() => authDialog.close(), 700);
    });

    const storedUser = JSON.parse(localStorage.getItem("touchgrass-user") || "null");
    if (storedUser) {
      document.querySelector(".login-button").textContent  = storedUser.displayName;
      document.querySelector(".signup-button").textContent = "✓ In";
    }

    /* ── Events ── */
    const savedPins      = new Set(JSON.parse(localStorage.getItem("touchgrass-pinned-events") || "[]"));
    const viewButtons    = document.querySelectorAll(".event-view");
    const allEventsView  = document.getElementById("allEventsView");
    const noPinnedEvents = document.getElementById("noPinnedEvents");
    const noEventsFound  = document.getElementById("noEventsFound");
    const eventList      = document.getElementById("eventList");
    let eventCards = [], activeView = "all", activeCategory = "All";
    const filterButtons = document.querySelectorAll(".filter-buttons button");

    const localEvents = [
      { id: "community-market",    name: "Community Market",       date: "Sat · 9:00 AM",  venue: "Downtown Plaza",           category: "Markets", emoji: "🛍️" },
      { id: "live-music-night",    name: "Live Music Night",       date: "Fri · 7:00 PM",  venue: "The Town Hall",            category: "Music",   emoji: "🎵" },
      { id: "neighborhood-art",    name: "Neighborhood Art Walk",  date: "Sun · 2:00 PM",  venue: "Main Street Arts District",category: "Arts",    emoji: "🎨" },
      { id: "pickup-sports",       name: "Pick-up Basketball",     date: "Sat · 10:00 AM", venue: "City Rec Center",          category: "Sports",  emoji: "🏀" },
      { id: "community-tech-talk", name: "Community Tech Talk",    date: "Thu · 6:30 PM",  venue: "Public Library",           category: "Tech",    emoji: "💻" },
    ];

    function updateEventView() {
      eventCards.forEach(c => {
        const matchesCategory = activeCategory === "All" || c.dataset.category === activeCategory;
        const matchesView = activeView !== "pinned" || savedPins.has(c.dataset.eventId);
        c.hidden = !matchesCategory || !matchesView;
      });
      noPinnedEvents.hidden   = activeView !== "pinned" || savedPins.size > 0;
      const visibleEvents = eventCards.filter(c => !c.hidden).length;
      noEventsFound.hidden = visibleEvents > 0 || activeView === "pinned" && savedPins.size === 0;
      noEventsFound.hidden = visibleEvents > 0 || activeView === "pinned" && savedPins.size === 0;
    }

    viewButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        activeView = btn.dataset.view;
        if (activeView === "pinned") {
          activeCategory = "All";
          allEventsView.hidden = false;
          filterButtons.forEach(filter => {
            filter.classList.toggle("filter-active", filter.dataset.category === "All");
            filter.classList.toggle("filter-button", filter.dataset.category !== "All");
          });
        }
        viewButtons.forEach(b => {
          b.classList.toggle("active", b === btn);
          b.setAttribute("aria-pressed", String(b === btn));
        });
        updateEventView();
      });
    });

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.category;
        activeView = "all";
        allEventsView.hidden = activeCategory !== "All";
        viewButtons.forEach(view => {
          view.classList.toggle("active", view === allEventsView && activeCategory === "All");
          view.setAttribute("aria-pressed", String(view === allEventsView && activeCategory === "All"));
        });
        filterButtons.forEach(filter => filter.classList.toggle("filter-active", filter === btn));
        filterButtons.forEach(filter => filter.classList.toggle("filter-button", filter !== btn));
        updateEventView();
      });
    });

    function renderEvents(events) {
      eventList.replaceChildren();
      eventCards = events.map(ev => {
        const card = document.createElement("article");
        card.className = "event-card";
        card.dataset.eventId = ev.id;
        card.dataset.category = ev.category;
        card.innerHTML = `
          <div class="event-icon">${ev.emoji}</div>
          <div class="event-info">
            <h3>${ev.name}</h3>
            <p>${ev.date}</p>
            <p>${ev.venue}</p>
            <strong>${ev.category}</strong>
          </div>
          <button class="pin-event" type="button" aria-label="Pin ${ev.name}" aria-pressed="false">📌</button>`;
        eventList.append(card);
        return card;
      });

      eventCards.forEach(card => {
        const pin = card.querySelector(".pin-event");
        const id  = card.dataset.eventId;
        const sync = () => {
          const pinned = savedPins.has(id);
          pin.classList.toggle("pinned", pinned);
          pin.setAttribute("aria-pressed", String(pinned));
        };
        pin.addEventListener("click", () => {
          savedPins.has(id) ? savedPins.delete(id) : savedPins.add(id);
          localStorage.setItem("touchgrass-pinned-events", JSON.stringify([...savedPins]));
          sync(); updateEventView();
        });
        sync();
      });
      updateEventView();
    }

    renderEvents(localEvents);
  </script>

</body>
</html>
